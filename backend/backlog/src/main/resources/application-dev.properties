# Dev profile (SPRING_PROFILES_ACTIVE=dev). Adds the dev-only seed location so a FRESH local
# database gets demo data (db/devseed/R__dev_seed.sql). The default/prod/test profiles use only
# classpath:db/migration, so real databases are never seeded with demo rows.
spring.flyway.locations=classpath:db/migration,classpath:db/devseed

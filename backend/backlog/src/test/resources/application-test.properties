# Test profile: points the context test at a LOCAL throwaway Postgres, never prod. The datasource
# is an explicit literal so neither the Neon default nor a .env can redirect it; everything else
# (Flyway on, ddl-auto=validate) is inherited from application.properties.
spring.datasource.url=jdbc:postgresql://localhost:5433/backlog
spring.datasource.username=verify
spring.datasource.password=verify
# fresh empty DB -> Flyway just runs V1 (no baseline needed)
spring.flyway.baseline-on-migrate=false
# Hard false, with no env override unlike the main config: this file is the checked-in guard, so
# the context test enforces "no lazy loading outside a transaction" even if a developer's
# gitignored application.properties has drifted.
spring.jpa.open-in-view=false
